        <text x="120" y="16" font-size="3" font-family="Liberation Sans, sans-serif">A outer ripstop, grid continues over the collar</text>
        <text x="120" y="26" font-size="3" font-family="Liberation Sans, sans-serif">B foam, memorandum 4–6 mm, not measured here</text>
        <text x="120" y="36" font-size="3" font-family="Liberation Sans, sans-serif">C lining, soft, powder-blue family</text>
        <text x="120" y="46" font-size="3" font-family="Liberation Sans, sans-serif">Edge is rolled and tonal on the card. Do not add a contrast binding.</text>
      </g>
    
  <line x1="10" y1="268" x2="410" y2="268" stroke="#1a1a1a" stroke-width="0.35"/>
  <text x="12" y="274" font-family="Liberation Sans, sans-serif" font-size="2.7" fill="#1a1a1a">Panel lines that are not visible on the card are omitted. Hidden reinforcements are marked as memorandum items.</text>
  <text x="12" y="280" font-family="Liberation Sans, sans-serif" font-size="2.7" fill="#4d6274">SCALE NTS · PROPORTION MODEL FROM THE REFERENCE CARD · NOT A MEASURED DRAWING · PROVISIONAL — PHYSICAL VALIDATION REQUIRED</text>
  <text x="12" y="286" font-family="Liberation Sans, sans-serif" font-size="2.6" fill="#1a1a1a">WORDMARK STAND-IN: MADE / SAiNT, LOWERCASE i REQUIRED. MATCH THE FOUNDER FILE. DO NOT CUT FROM THIS SHEET.</text>
