      <text x="14" y="214" font-size="3.1" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Order is from the ground up. The footbed is removable and is not in the bond stack.</text>

  <text x="14" y="38" font-size="4" font-family="Liberation Serif, Times New Roman, serif" fill="#1a1a1a">A  Verify</text>
<text x="14" y="43" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Swatch the ripstop. Confirm powder blue and whether the white grid is actually in the cloth. Identify a US M 12 2E</text>
<text x="14" y="47.2" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">last and a black sole with a raised wall and a round toe bumper. Do not cut yet.</text>
<text x="14" y="55.2" font-size="4" font-family="Liberation Serif, Times New Roman, serif" fill="#1a1a1a">B  Trace</text>
<text x="14" y="60.2" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Tape the last. Trace the feather, the opening, and the sole cavity. Rebuild sheets 02 and 06 on that trace. Retire</text>
<text x="14" y="64.4" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">this proportion model.</text>
<text x="14" y="72.4" font-size="4" font-family="Liberation Serif, Times New Roman, serif" fill="#1a1a1a">C  Mock</text>
<text x="14" y="77.4" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Paper or cheap-cloth upper. Check the open heel, the collar height, and the logo-tab position against the card.</text>
<text x="14" y="85.4" font-size="4" font-family="Liberation Serif, Times New Roman, serif" fill="#1a1a1a">D  Upper</text>
<text x="14" y="90.4" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Stabilize only after a bond test. Sew the shell, foam, and lining. Roll the collar in the shell cloth. Stitch the logo</text>
<text x="14" y="94.60000000000001" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">tab on the heel collar. Deboss or stamp from the wordmark file.</text>
<text x="14" y="102.60000000000001" font-size="4" font-family="Liberation Serif, Times New Roman, serif" fill="#1a1a1a">E  Footbed</text>
<text x="14" y="107.60000000000001" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Fit cork to the cavity. Laminate microfiber. Place the supplied art head-to-toe, wordmark toward the heel. Rub-test a</text>
<text x="14" y="111.80000000000001" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">spare.</text>
<text x="14" y="119.80000000000001" font-size="4" font-family="Liberation Serif, Times New Roman, serif" fill="#1a1a1a">F  Bottom</text>
<text x="14" y="124.80000000000001" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Rough and cement per the adhesive sheet. Wipe squeeze-out. Do not add a separate rand if the sole already has the</text>
<text x="14" y="129.0" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">wall.</text>
<text x="14" y="137.0" font-size="4" font-family="Liberation Serif, Times New Roman, serif" fill="#1a1a1a">G  Check</text>
<text x="14" y="142.0" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">Forefoot clearance, heel retention, level sole, no early separation, collar comfort, art still readable. Record</text>
<text x="14" y="146.2" font-size="3" font-family="Liberation Sans, sans-serif" fill="#1a1a1a">changes as revision 002.</text>
