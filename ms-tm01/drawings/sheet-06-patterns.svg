  <text x="12" y="274" font-family="Liberation Sans, sans-serif" font-size="2.7" fill="#1a1a1a">Grain arrow is the intended heel-to-toe direction of the shell. Confirm warp on the Yardblox swatch. Grid alignment is visual.</text>
